name: Probe Unicode response content-disposition names
on:
  workflow_dispatch:
  push:
    branches: [probe-rscd-unicode-header-20261025]
    paths:
      - .github/workflows/probe-rscd-unicode-header.yml
permissions:
  actions: read
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v8
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          github-token: ${{ github.token }}
          script: |
            const crypto = require('node:crypto');
            const https = require('node:https');
            const runtime = process.env.ACTIONS_RUNTIME_TOKEN;
            const results = process.env.ACTIONS_RESULTS_URL;
            const repo = process.env.GITHUB_REPOSITORY;
            const [, owner, repoName] = repo.match(/^([^/]+)\/(.+)$/);
            if (!runtime || !results) throw new Error('Actions Results runtime unavailable');
            const claims = JSON.parse(Buffer.from(runtime.split('.')[1], 'base64url').toString());
            const scope = String(claims.scp || '').split(' ').find(x => x.startsWith('Actions.Results:'));
            const [, runId, jobId] = scope.split(':');
            const ids = {workflow_run_backend_id: runId, workflow_job_run_backend_id: jobId};
            const base = new URL(results).origin + '/twirp/github.actions.results.api.v1.ArtifactService/';
            const payload = Buffer.from(JSON.stringify({probe: 'rscd-unicode', repository: repo}));
            const digest = 'sha256:' + crypto.createHash('sha256').update(payload).digest('hex');
            async function rpc(method, document) {
              const response = await fetch(base + method, {method: 'POST', headers: {Authorization: `Bearer ${runtime}`, 'Content-Type': 'application/json'}, body: JSON.stringify(document)});
              const text = await response.text();
              let data = {}; try { data = JSON.parse(text); } catch {}
              return {status: response.status, data, text};
            }
            function getRawHeaders(url) { return new Promise((resolve, reject) => {
              https.get(url, response => {
                const wanted = [];
                for (let i = 0; i < response.rawHeaders.length; i += 2) {
                  const key = response.rawHeaders[i], value = response.rawHeaders[i + 1];
                  if (/^content-(type|disposition)$/i.test(key)) wanted.push([key, value]);
                }
                const chunks = []; response.on('data', chunk => chunks.push(chunk));
                response.on('end', () => resolve({status: response.statusCode, headers: wanted, bytes: Buffer.concat(chunks)}));
              }).on('error', reject);
            }); }
            const suffixes = [
              ['line', 'sep-\u2028Content-Type%3A%20%25C2%2585application%2Fjson'],
              ['paragraph', 'sep-\u2029Content-Type%3A%20%25C2%2585application%2Fjson'],
            ];
            for (const [label, suffix] of suffixes) {
              const name = `rscd-${runId}-${suffix}`;
              const created = await rpc('CreateArtifact', {...ids, name, version: 7, mime_type: 'application/json'});
              if (!created.data?.ok || !created.data?.signed_upload_url) { console.log(`${label} CREATE=${created.status} msg=${JSON.stringify(created.data?.msg || created.text)}`); continue; }
              const upload = await fetch(created.data.signed_upload_url, {method: 'PUT', headers: {'x-ms-blob-type': 'BlockBlob', 'x-ms-blob-content-type': '\u0085application/json', 'x-ms-version': '2023-11-03', 'Content-Type': 'application/octet-stream'}, body: payload});
              await upload.arrayBuffer();
              if (!upload.ok) { console.log(`${label} CREATE=200 UPLOAD=${upload.status}`); continue; }
              const finalized = await rpc('FinalizeArtifact', {...ids, name, size: String(payload.length), hash: digest});
              const id = String(finalized.data?.artifact_id || finalized.data?.artifactId || '');
              if (!finalized.data?.ok || !/^\d+$/.test(id)) { console.log(`${label} CREATE=200 FINALIZE=${finalized.status} msg=${JSON.stringify(finalized.data?.msg || finalized.text)}`); continue; }
              const signed = await rpc('GetSignedArtifactURL', {...ids, name});
              const signedUrl = signed.data?.signed_url || signed.data?.signedUrl || '';
              let direct = 'no signed url';
              if (signedUrl) { const read = await getRawHeaders(signedUrl); direct = JSON.stringify({status: read.status, headers: read.headers, bytes: read.bytes.length, exact: read.bytes.equals(payload)}); }
              const rest = await fetch(`https://api.github.com/repos/${owner}/${repoName}/actions/artifacts/${id}/zip`, {redirect: 'manual', headers: {Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github.v3+json'}});
              const location = rest.headers.get('location');
              const rsct = location ? new URL(location).searchParams.get('rsct') : null;
              if (!location) { console.log(`${label} ID=${id} GETSIGNED=${signed.status} direct=${direct} REST=${rest.status} TYPE=${JSON.stringify(rest.headers.get('content-type'))}`); continue; }
              await rest.body?.cancel();
              const viaRest = await getRawHeaders(location);
              console.log(`${label} ID=${id} GETSIGNED=${signed.status} direct=${direct} REST=302 RSCT=${JSON.stringify(rsct)} viaRest=${JSON.stringify({status: viaRest.status, headers: viaRest.headers, bytes: viaRest.bytes.length, exact: viaRest.bytes.equals(payload)})}`);
            }
