name: Test sequential v6 v7 ordering
on:
  push:
    branches:
      - probe-sequential-v6-v7-order-20261025
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save @actions/artifact@6.3.1 @azure/storage-blob@12.31.0
      - name: Test both sequential orders
        uses: ./.github/actions/seq-race
        env:
          GH_TOKEN: ${{ github.token }}
