name: Verify artifact Content-Type controls
on:
  push:
    branches:
      - probe-content-type-controls-20261025
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save @actions/artifact@6.3.1 @azure/storage-blob@12.31.0
      - name: Try Python-only trim characters and inspect REST
        uses: ./.github/actions/mime-controls
        env:
          GH_TOKEN: ${{ github.token }}
