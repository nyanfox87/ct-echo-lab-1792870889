name: Probe artifact MIME by protocol version
on:
  push:
    branches:
      - probe-artifact-version-mime-20261025
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save @actions/artifact@6.3.1 @azure/storage-blob@12.31.0
      - name: Test MIME behavior over versions 0 through 10
        uses: ./.github/actions/version-mime
        env:
          GH_TOKEN: ${{ github.token }}
