name: Probe raw Twirp v7 percent MIME
on:
  workflow_dispatch:
  push:
    branches: [probe-direct-v7-percent-mime-20261025]
    paths:
      - .github/workflows/probe-direct-v7-percent-mime.yml
permissions:
  actions: read
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v8
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          github-token: ${{ github.token }}
          script: |
            const crypto = require('node:crypto');
            const runtime = process.env.ACTIONS_RUNTIME_TOKEN;
            const results = process.env.ACTIONS_RESULTS_URL;
            const repo = process.env.GITHUB_REPOSITORY;
            if (!runtime || !results) throw new Error('Actions Results runtime unavailable');
            const claims = JSON.parse(Buffer.from(runtime.split('.')[1], 'base64url').toString());
            const scope = String(claims.scp || '').split(' ').find(x => x.startsWith('Actions.Results:'));
            const [, runId, jobId] = scope.split(':');
            const ids = {workflow_run_backend_id: runId, workflow_job_run_backend_id: jobId};
            const base = new URL(results).origin + '/twirp/github.actions.results.api.v1.ArtifactService/';
            const payload = Buffer.from(JSON.stringify({probe: 'raw-twirp-percent-mime', repository: repo}));
            const digest = 'sha256:' + crypto.createHash('sha256').update(payload).digest('hex');
            async function rpc(method, document) {
              const response = await fetch(base + method, {method: 'POST', headers: {Authorization: `Bearer ${runtime}`, 'Content-Type': 'application/json'}, body: JSON.stringify(document)});
              const text = await response.text();
              let data = {}; try { data = JSON.parse(text); } catch {}
              return {status: response.status, data, text};
            }
            const cases = [
              ['suffix_85', 'application/json%85'],
              ['suffix_c285', 'application/json%C2%85'],
              ['prefix_85', '%85application/json'],
              ['prefix_c285', '%C2%85application/json'],
            ];
            for (const [label, mime] of cases) {
              const artifactName = `raw-percent-${runId}-${label}`;
              const created = await rpc('CreateArtifact', {...ids, name: artifactName, version: 7, mime_type: mime});
              if (!created.data?.ok || !created.data?.signed_upload_url) {
                console.log(`${label} MIME=${JSON.stringify(mime)} CREATE=${created.status} ok=${Boolean(created.data?.ok)} message=${JSON.stringify(String(created.data?.msg || created.data?.message || created.text).slice(0,160))}`);
                continue;
              }
              const upload = await fetch(created.data.signed_upload_url, {method: 'PUT', headers: {'x-ms-blob-type': 'BlockBlob', 'x-ms-blob-content-type': mime, 'x-ms-version': '2023-11-03', 'Content-Type': 'application/octet-stream'}, body: payload});
              await upload.arrayBuffer();
              if (!upload.ok) { console.log(`${label} CREATE=200 UPLOAD=${upload.status}`); continue; }
              const fin = await rpc('FinalizeArtifact', {...ids, name: artifactName, size: String(payload.length), hash: digest});
              const id = String(fin.data?.artifact_id || fin.data?.artifactId || '');
              if (!fin.data?.ok || !/^\d+$/.test(id)) { console.log(`${label} CREATE=200 FINALIZE=${fin.status} message=${JSON.stringify(String(fin.data?.msg || fin.text).slice(0,160))}`); continue; }
              const rest = await fetch(`https://api.github.com/repos/${repo}/actions/artifacts/${id}/zip`, {redirect: 'manual', headers: {Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github.v3+json'}});
              const location = rest.headers.get('location');
              const rsct = location ? new URL(location).searchParams.get('rsct') : null;
              if (!location) { console.log(`${label} CREATE=200 FINALIZE=200 ID=${id} REST=${rest.status} TYPE=${JSON.stringify(rest.headers.get('content-type'))}`); continue; }
              await rest.body?.cancel();
              const final = await fetch(location);
              const type = final.headers.get('content-type') || '';
              const body = Buffer.from(await final.arrayBuffer());
              console.log(`${label} MIME=${JSON.stringify(mime)} ID=${id} REST=302 RSCT=${JSON.stringify(rsct)} TYPE=${JSON.stringify(type)} TYPEHEX=${Buffer.from(type).toString('hex')} BYTES=${body.length} EXACT=${body.equals(payload)}`);
            }
