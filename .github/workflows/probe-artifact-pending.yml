name: Probe artifact visibility before finalize

on:
  push:
    branches:
      - probe-artifact-rpc-update-20261025

permissions:
  actions: write
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v8
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          script: |
            const runtimeToken = process.env.ACTIONS_RUNTIME_TOKEN;
            const resultsOrigin = new URL(process.env.ACTIONS_RESULTS_URL).origin;
            const claims = JSON.parse(Buffer.from(runtimeToken.split('.')[1], 'base64url').toString('utf8'));
            const scope = claims.scp.split(' ').find(x => x.startsWith('Actions.Results:'));
            const [, workflowRunBackendId, workflowJobRunBackendId] = scope.split(':');
            const ids = {workflow_run_backend_id: workflowRunBackendId, workflow_job_run_backend_id: workflowJobRunBackendId};
            const service = `${resultsOrigin}/twirp/github.actions.results.api.v1.ArtifactService/`;
            const body = Buffer.from(JSON.stringify({probe: 'pending-artifact-visibility'}));
            const sha = require('crypto').createHash('sha256').update(body).digest('hex');

            async function twirp(method, payload) {
              const r = await fetch(service + method, {method: 'POST', headers: {
                Authorization: `Bearer ${runtimeToken}`, 'Content-Type': 'application/json'
              }, body: JSON.stringify(payload)});
              const data = await r.json().catch(() => ({}));
              return {status: r.status, data};
            }
            async function list(name) {
              const r = await twirp('ListArtifacts', {...ids, name_filter: name});
              return {status: r.status, ids: (r.data.artifacts || [])
                .filter(x => x.name === name)
                .map(x => String(x.database_id || x.databaseId || '')).filter(Boolean)};
            }
            async function rest(id, phase) {
              const u = `https://api.github.com/repos/${context.repo.owner}/${context.repo.repo}/actions/artifacts/${id}/zip`;
              const r = await fetch(u, {redirect: 'manual', headers: {
                Authorization: `Bearer ${process.env.GH_TOKEN}`,
                Accept: 'application/vnd.github.v3+json'
              }});
              const location = r.headers.get('location');
              const rsct = location ? new URL(location).searchParams.get('rsct') : null;
              console.log('REST', JSON.stringify({phase, id, status: r.status, contentType: r.headers.get('content-type'), rsct}));
            }
            async function run(label, finalizeFields) {
              const name = `pending-${context.runId}-${label}`;
              const created = await twirp('CreateArtifact', {...ids, name, version: 7, mime_type: 'application/json'});
              const uploadUrl = created.data.signed_upload_url || created.data.signedUploadUrl;
              if (!uploadUrl) { console.log('CREATE_FAILED', JSON.stringify({label, status: created.status, code: created.data.code})); return; }
              const uploaded = await fetch(uploadUrl, {method: 'PUT', headers: {
                'x-ms-blob-type': 'BlockBlob', 'x-ms-blob-content-type': 'application/json',
                'Content-Length': String(body.length)
              }, body});
              if (!uploaded.ok) { console.log('UPLOAD_FAILED', JSON.stringify({label, status: uploaded.status})); return; }

              const before = await list(name);
              const signed = await twirp('GetSignedArtifactURL', {...ids, name});
              const signedUrl = signed.data.signed_url || signed.data.signedUrl;
              console.log('BEFORE_FINALIZE', JSON.stringify({label, listStatus: before.status,
                ids: before.ids, signedStatus: signed.status,
                signedRsct: signedUrl ? new URL(signedUrl).searchParams.get('rsct') : null}));
              for (const id of before.ids) await rest(id, 'before-finalize');

              const finalized = await twirp('FinalizeArtifact', {...ids, name, ...finalizeFields});
              const responseId = String(finalized.data.artifact_id || finalized.data.artifactId || '');
              const immediate = await list(name);
              await new Promise(resolve => setTimeout(resolve, 1200));
              const delayed = await list(name);
              console.log('AFTER_FINALIZE', JSON.stringify({label, status: finalized.status,
                ok: Boolean(finalized.data.ok), code: finalized.data.code || null,
                responseId, immediate, delayed}));
              for (const id of new Set([responseId, ...immediate.ids, ...delayed.ids].filter(Boolean))) {
                await rest(id, 'after-finalize-' + label);
              }
            }

            await run('control', {size: String(body.length), hash: `sha256:${sha}`});
            await run('negative-size', {size: '-1'});
            await run('mismatch-size', {size: String(body.length + 1)});
            await run('wrong-hash', {size: String(body.length), hash: `sha256:${'0'.repeat(64)}`});
            await run('invalid-hash', {size: String(body.length), hash: 'not-a-digest'});
