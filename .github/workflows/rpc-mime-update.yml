name: Probe artifact MIME metadata update RPC

on:
  workflow_dispatch:
  push:
    branches:
      - probe-artifact-rpc-update-20261025

permissions:
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          script: |
            const {createHash} = require('node:crypto');
            const token = process.env.ACTIONS_RUNTIME_TOKEN;
            const resultsUrl = process.env.ACTIONS_RESULTS_URL;
            if (!token || !resultsUrl) throw new Error('Missing runtime artifact credentials');
            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString());
            const scope = claims.scp.split(' ').find(s => s.startsWith('Actions.Results:'));
            if (!scope) throw new Error('Missing Actions.Results scope');
            const [, workflowRunBackendId, workflowJobRunBackendId] = scope.split(':');
            const ids = {workflow_run_backend_id: workflowRunBackendId, workflow_job_run_backend_id: workflowJobRunBackendId};
            const service = new URL('/twirp/github.actions.results.api.v1.ArtifactService/', resultsUrl);
            const rpc = async (method, body) => {
              const response = await fetch(new URL(method, service), {
                method: 'POST',
                headers: {Authorization: `Bearer ${token}`, 'Content-Type': 'application/json'},
                body: JSON.stringify(body),
              });
              const text = await response.text();
              let data = {};
              try { data = JSON.parse(text); } catch {}
              core.info(`RPC ${method} status=${response.status} body=${JSON.stringify(data).slice(0, 240)}`);
              return {status: response.status, data};
            };

            const name = `rpc-mime-${context.runId}`;
            const created = await rpc('CreateArtifact', {
              ...ids, name, version: 7, mime_type: {value: 'application/json'},
            });
            if (created.status !== 200 || created.data.ok !== true) throw new Error('CreateArtifact failed');
            const uploadUrl = created.data.signed_upload_url || created.data.signedUploadUrl;
            if (typeof uploadUrl !== 'string') throw new Error('No signed upload URL');
            const upload = async bytes => {
              const response = await fetch(uploadUrl, {
                method: 'PUT',
                headers: {
                  'x-ms-blob-type': 'BlockBlob',
                  'x-ms-blob-content-type': 'application/json',
                  'x-ms-version': '2023-11-03',
                  'Content-Type': 'application/octet-stream',
                },
                body: bytes,
              });
              if (!response.ok) throw new Error(`Blob upload failed: ${response.status}`);
            };
            const placeholder = Buffer.from('{}');
            await upload(placeholder);
            const finalized = await rpc('FinalizeArtifact', {
              ...ids, name, size: String(placeholder.length),
              hash: {value: `sha256:${createHash('sha256').update(placeholder).digest('hex')}`},
            });
            if (finalized.status !== 200 || finalized.data.ok !== true) throw new Error('FinalizeArtifact failed');
            const artifactId = String(finalized.data.artifact_id || finalized.data.artifactId);
            const repository = `${context.repo.owner}/${context.repo.repo}/actions/artifacts/${artifactId}/zip`;
            const payload = Buffer.from(JSON.stringify({
              full_name: repository,
              owner: {login: 'probe', avatar_url: 'file:///proc/self/environ'},
              description: 'RPC metadata update probe',
            }));
            await upload(payload);

            const weird = 'application/json\u0085';
            for (const [method, body] of [
              ['UpdateArtifact', {...ids, name, version: 7, mime_type: {value: weird}}],
              ['UpdateArtifactMetadata', {...ids, name, mime_type: {value: weird}}],
              ['SetArtifactMimeType', {...ids, name, mime_type: {value: weird}}],
              ['ModifyArtifact', {...ids, name, mime_type: {value: weird}}],
            ]) {
              try { await rpc(method, body); }
              catch (error) { core.info(`RPC ${method} exception=${String(error).slice(0, 100)}`); }
            }

            const endpoint = `https://api.github.com/repos/${context.repo.owner}/${context.repo.repo}/actions/artifacts/${artifactId}/zip`;
            const response = await fetch(endpoint, {
              headers: {Authorization: `Bearer ${process.env.GITHUB_TOKEN}`, Accept: 'application/vnd.github.v3+json'},
            });
            const body = Buffer.from(await response.arrayBuffer());
            core.info(`READBACK status=${response.status} type_hex=${Buffer.from(response.headers.get('content-type') || '', 'latin1').toString('hex')} bytes=${body.length} matches=${body.equals(payload)} sha256=${createHash('sha256').update(body).digest('hex')}`);
