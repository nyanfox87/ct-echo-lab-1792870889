name: Probe raw non-UTF8 artifact MIME bytes
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/probe_artifact_name_unicode.yml
permissions:
  actions: read
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/github-script@v8
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          github-token: ${{ github.token }}
          script: |
            const crypto = require('node:crypto');
            const runtime = process.env.ACTIONS_RUNTIME_TOKEN;
            const results = process.env.ACTIONS_RESULTS_URL;
            const repo = process.env.GITHUB_REPOSITORY;
            if (!runtime || !results) throw new Error('Actions Results runtime unavailable');
            const claims = JSON.parse(Buffer.from(runtime.split('.')[1], 'base64url').toString());
            const scope = String(claims.scp || '').split(' ').find(x => x.startsWith('Actions.Results:'));
            const [, runId, jobId] = scope.split(':');
            const ids = {workflow_run_backend_id: runId, workflow_job_run_backend_id: jobId};
            const base = new URL(results).origin + '/twirp/github.actions.results.api.v1.ArtifactService/';
            function varint(value) {
              const out=[];
              do { let b=value&0x7f; value >>>= 7; if(value)b|=0x80; out.push(b); } while(value);
              return Buffer.from(out);
            }
            function bytesField(field, bytes) { return Buffer.concat([varint(field*8+2),varint(bytes.length),bytes]); }
            function stringValue(bytes) { return bytesField(1,bytes); }
            function createBody(name,mimeBytes) {
              return Buffer.concat([
                bytesField(1,Buffer.from(runId)), bytesField(2,Buffer.from(jobId)),
                bytesField(3,Buffer.from(name)), varint(5*8), varint(7),
                bytesField(6,stringValue(mimeBytes)),
              ]);
            }
            function readVarint(buf,state) {
              let value=0,shift=0;
              while(state.pos<buf.length){const b=buf[state.pos++];value+=(b&0x7f)*2**shift;if(!(b&0x80))return value;shift+=7;}
              throw new Error('truncated protobuf response');
            }
            function decodeCreate(buf,contentType) {
              if(contentType.includes('json')) { const v=JSON.parse(buf.toString('utf8')); return {ok:v.ok===true,url:v.signed_upload_url||v.signedUploadUrl,msg:String(v.msg||v.code||'').slice(0,120)}; }
              const state={pos:0}; let ok=false,url='';
              while(state.pos<buf.length){const tag=readVarint(buf,state),field=Math.floor(tag/8),wire=tag%8;if(wire===0){const value=readVarint(buf,state);if(field===1)ok=value!==0;}else if(wire===2){const n=readVarint(buf,state),v=buf.subarray(state.pos,state.pos+n);state.pos+=n;if(field===2)url=v.toString('utf8');}else throw new Error(`unexpected response wire ${wire}`);}
              return {ok,url,msg:''};
            }
            async function jsonRpc(method,document) {
              const response=await fetch(base+method,{method:'POST',headers:{Authorization:`Bearer ${runtime}`,'Content-Type':'application/json'},body:JSON.stringify(document)});
              const text=await response.text();let data={};try{data=JSON.parse(text);}catch{}
              return {status:response.status,data,text};
            }
            async function put(url,body) {
              const response=await fetch(url,{method:'PUT',headers:{'x-ms-blob-type':'BlockBlob','x-ms-version':'2023-11-03','x-ms-blob-content-type':'application/json','Content-Type':'application/octet-stream'},body});
              await response.arrayBuffer(); return response.status;
            }
            async function test(label,mimeBytes) {
              const name=`raw-mime-${runId}-${label}`;
              const response=await fetch(base+'CreateArtifact',{method:'POST',headers:{Authorization:`Bearer ${runtime}`,'Content-Type':'application/protobuf'},body:createBody(name,mimeBytes)});
              const responseBytes=Buffer.from(await response.arrayBuffer());
              let created;
              try{created=decodeCreate(responseBytes,response.headers.get('content-type')||'');}
              catch(error){console.log(`RAWBYTE ${JSON.stringify({label,stage:'decode',status:response.status,error:String(error.message).slice(0,120)})}`);return;}
              if(response.status!==200||!created.ok||!created.url){console.log(`RAWBYTE ${JSON.stringify({label,stage:'create',status:response.status,ok:created.ok,msg:created.msg,responseHex:responseBytes.subarray(0,100).toString('hex')})}`);return;}
              const placeholder=Buffer.from('{"probe":"raw-mime-byte"}');
              const firstPut=await put(created.url,placeholder);
              if(firstPut!==201){console.log(`RAWBYTE ${JSON.stringify({label,stage:'upload',status:firstPut})}`);return;}
              const digest='sha256:'+crypto.createHash('sha256').update(placeholder).digest('hex');
              const finalized=await jsonRpc('FinalizeArtifact',{...ids,name,size:String(placeholder.length),hash:digest});
              const id=String(finalized.data.artifact_id||finalized.data.artifactId||'');
              if(finalized.status!==200||finalized.data.ok!==true||!/^\d+$/.test(id)){console.log(`RAWBYTE ${JSON.stringify({label,stage:'finalize',status:finalized.status,ok:finalized.data.ok})}`);return;}
              const payload=Buffer.from(JSON.stringify({full_name:`${repo}/actions/artifacts/${id}/zip`,owner:{login:'cassette',avatar_url:'file:///proc/self/environ'},description:'raw MIME byte probe',stargazers_count:0}));
              const overwrite=await put(created.url,payload);
              const rest=await fetch(`https://api.github.com/repos/${repo}/actions/artifacts/${id}/zip`,{redirect:'manual',headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github.v3+json'}});
              const location=rest.headers.get('location');
              let finalStatus=0,type='',body=Buffer.alloc(0),rsct='';
              if(location){const url=new URL(location);rsct=url.searchParams.get('rsct')||'';const final=await fetch(location);finalStatus=final.status;type=final.headers.get('content-type')||'';body=Buffer.from(await final.arrayBuffer());}
              const part=type.split(',',1)[0].split(';',1)[0];
              const python=part.replace(/^[\s\x1c-\x1f\x85]+|[\s\x1c-\x1f\x85]+$/gu,'').toLowerCase();
              const node=part.trim().toLowerCase();
              console.log(`RAWBYTE ${JSON.stringify({label,createStatus:response.status,artifactId:id,overwrite,restStatus:rest.status,finalStatus,rsctUtf8Hex:Buffer.from(rsct,'utf8').toString('hex'),typeCodepoints:[...type].map(c=>c.codePointAt(0).toString(16)),typeLatin1Hex:Buffer.from(type,'latin1').toString('hex'),typeUtf8Hex:Buffer.from(type,'utf8').toString('hex'),nodeType:node,pythonType:python,bodyLength:body.length,bodyExact:body.equals(payload),fullNameMatch:(()=>{try{return JSON.parse(body.toString('utf8')).full_name===`${repo}/actions/artifacts/${id}/zip`}catch{return false}})()})}`);
            }
            await test('tail-raw-85',Buffer.concat([Buffer.from('application/json'),Buffer.from([0x85])]));
            await test('prefix-raw-85',Buffer.concat([Buffer.from([0x85]),Buffer.from('application/json')]));
