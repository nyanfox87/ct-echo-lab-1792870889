name: Probe Unicode artifact name collisions
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/probe_artifact_name_unicode.yml
permissions:
  actions: read
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v8
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          github-token: ${{ github.token }}
          script: |
            const crypto = require('node:crypto');
            const runtime = process.env.ACTIONS_RUNTIME_TOKEN;
            const results = process.env.ACTIONS_RESULTS_URL;
            const repo = process.env.GITHUB_REPOSITORY;
            const [, owner, name] = repo.match(/^([^/]+)\/(.+)$/);
            if (!runtime || !results) throw new Error('Actions Results runtime unavailable');
            const claims = JSON.parse(Buffer.from(runtime.split('.')[1], 'base64url').toString());
            const scope = String(claims.scp || '').split(' ').find(x => x.startsWith('Actions.Results:'));
            const [, runId, jobId] = scope.split(':');
            const ids = {workflow_run_backend_id: runId, workflow_job_run_backend_id: jobId};
            const base = new URL(results).origin + '/twirp/github.actions.results.api.v1.ArtifactService/';
            const payload = Buffer.from(JSON.stringify({probe: 'unicode-name-collision', owner, repository: name}));
            const digest = 'sha256:' + crypto.createHash('sha256').update(payload).digest('hex');
            async function rpc(method, document) {
              const response = await fetch(base + method, {method: 'POST', headers: {Authorization: `Bearer ${runtime}`, 'Content-Type': 'application/json'}, body: JSON.stringify(document)});
              const text = await response.text();
              let data = {}; try { data = JSON.parse(text); } catch {}
              return {status: response.status, data, text};
            }
            async function one(label, version, mime, artifactName) {
              const created = await rpc('CreateArtifact', {...ids, name: artifactName, version, mime_type: mime});
              if (!created.data?.ok || !created.data?.signed_upload_url) {
                console.log(`${label} v${version} CREATE=${created.status} ok=${Boolean(created.data?.ok)} error=${JSON.stringify(String(created.data?.msg || created.data?.message || created.text).slice(0,100))}`);
                return null;
              }
              const upload = await fetch(created.data.signed_upload_url, {method: 'PUT', headers: {'x-ms-blob-type': 'BlockBlob', 'x-ms-blob-content-type': mime, 'x-ms-version': '2023-11-03', 'Content-Type': 'application/octet-stream'}, body: payload});
              await upload.arrayBuffer();
              if (!upload.ok) { console.log(`${label} v${version} UPLOAD=${upload.status}`); return null; }
              const fin = await rpc('FinalizeArtifact', {...ids, name: artifactName, size: String(payload.length), hash: digest});
              const id = String(fin.data?.artifact_id || fin.data?.artifactId || '');
              if (!fin.data?.ok || !/^\d+$/.test(id)) {
                console.log(`${label} v${version} FINALIZE=${fin.status} ok=${Boolean(fin.data?.ok)} error=${JSON.stringify(String(fin.data?.msg || fin.text).slice(0,100))}`);
                return null;
              }
              const rest = await fetch(`https://api.github.com/repos/${repo}/actions/artifacts/${id}/zip`, {redirect: 'manual', headers: {Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github.v3+json'}});
              const location = rest.headers.get('location');
              const rsct = location ? new URL(location).searchParams.get('rsct') : null;
              let type = '';
              let exact = false;
              let bodyLength = -1;
              if (location) { const final = await fetch(location); type = final.headers.get('content-type') || ''; const body = Buffer.from(await final.arrayBuffer()); exact = body.equals(payload); bodyLength = body.length; }
              console.log(`${label} v${version} CREATE=200 FINALIZE=200 ID=${id} REST=${rest.status} RSCT=${JSON.stringify(rsct)} TYPE=${JSON.stringify(type)} TYPEHEX=${Buffer.from(type).toString('hex')} BYTES=${bodyLength} EXACT=${exact}`);
              return id;
            }
            const weird = 'application/json\u0085';
            const safe = 'application/json';
            const pairs = [
              ['nel', 'x\u0085', 'x'],
              ['nfc', '\u00e9', 'e\u0301'],
              ['angstrom', '\u00c5', 'A\u030a'],
              ['trailing_dot', 'x.', 'x'],
              ['zero_width', 'x\u200b', 'x'],
              ['fullwidth_dot', 'x\uff0e', 'x.'],
            ];
            for (let i = 0; i < pairs.length; i++) {
              const [label, a, b] = pairs[i];
              for (let reverse = 0; reverse < 2; reverse++) {
                const nA = `uc-${runId}-${label}-${a}`;
                const nB = `uc-${runId}-${label}-${b}`;
                const order = reverse ? [[nB, 7, safe], [nA, 6, weird]] : [[nA, 6, weird], [nB, 7, safe]];
                console.log(`PAIR ${label} reverse=${reverse}`);
                for (const [artifactName, version, mime] of order) await one(label, version, mime, artifactName);
              }
            }
